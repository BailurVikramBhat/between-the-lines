spring.application.name=between-the-lines-backend
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/between_the_lines
spring.datasource.username=btl_user
spring.datasource.password=btl_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
