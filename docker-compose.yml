services:
  postgres:
    container_name: between-the-lines-postgres
    image: postgres:17
    environment:
      POSTGRES_DB: between_the_lines
      POSTGRES_USER: btl_user
      POSTGRES_PASSWORD: btl_password
    ports:
      - "5432:5432"
    volumes:
      - btl-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btl_user -d between_the_lines"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  btl-postgres-data:
